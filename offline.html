<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — NeuroPrep</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #070b18; color: #e2e8f0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px;
    }
    .card { max-width: 460px; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      display: grid; place-items: center; font-size: 34px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; color: #94a3b8; line-height: 1.6; font-size: 14px; }
    button {
      border: 0; padding: 12px 28px; border-radius: 12px; font-size: 15px; font-weight: 600;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6); color: white; cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    .hint { margin-top: 18px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">🧠</div>
    <h1>You're offline</h1>
    <p>NeuroPrep couldn't reach the network. Question banks you've already studied this session are still available — reconnect and reload to sync everything else.</p>
    <button onclick="location.reload()">Reload</button>
    <p class="hint">Tip: studied banks are cached automatically for offline practice.</p>
  </main>
</body>
</html>
